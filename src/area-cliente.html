<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente | Studio 91</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/client-area.css"> </head>
<body>

    <header>
        <div class="container navbar">
            <div class="logo">STUDIO<span>91</span></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Voltar ao Site</a></li>
                    <li><a href="#" id="logout-btn" style="color: #ff4d4d;">Sair</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="client-content">
        <div class="container">
            <div class="welcome-header">
                <h1>Olá, <span id="user-name">Cliente</span></h1>
                <p>Aqui estão os registros dos seus momentos.</p>
            </div>

            <section id="albums-view">
                <h2>Meus Álbuns</h2>
                <div class="grid-albums" id="albums-container">
                    </div>
            </section>

            <section id="photos-view" class="hidden">
                <div class="photos-header">
                    <button class="btn-back" onclick="closeAlbum()">← Voltar para Álbuns</button>
                    <h2 id="album-title">Título do Álbum</h2>
                </div>
                <div class="grid-photos" id="photos-container">
                    </div>
            </section>
        </div>
    </main>

    <div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-img" id="lightbox-img" src="" alt="Visualização">
    </div>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Studio 91. Área Restrita.</p>
        </div>
    </footer>

    <script src="js/client.js"></script>
</body>
</html>
