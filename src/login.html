<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente - Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-logo">STUDIO<span>91</span></div>
        <p class="login-subtitle">Acesse suas fotos e vídeos exclusivos.</p>

        <form action="#" method="POST">
            
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="cliente@email.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha de Acesso</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-login">ACESSAR ÁREA DO CLIENTE</button>
        </form>

        <div class="links-uteis">
            <a href="index.html">← Voltar para o site</a>
            <a href="#">Esqueci minha senha</a>
        </div>
    </div>

</body>
</html>
