<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Administrativo | Studio 91</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    
    <style>
        /* Estilos exclusivos para diferenciar do login de cliente */
        body.admin-login {
            background: #000; /* Fundo preto total */
        }
        .admin-tag {
            background-color: #ff4d4d;
            color: #fff !important;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            vertical-align: middle;
            margin-left: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="login-page admin-login">

    <div class="login-card">
        <div class="login-logo">STUDIO<span>91</span> <span class="admin-tag">ADMIN</span></div>
        <p class="login-subtitle">Acesso restrito à gerência.</p>

        <form id="admin-login-form">
            
            <div class="input-group">
                <label for="email">E-mail Administrativo</label>
                <input type="email" id="email" name="email" placeholder="admin@studio91.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-login">ENTRAR NO PAINEL</button>
        </form>

        <div class="links-uteis">
            <a href="index.html">← Voltar ao Site</a>
        </div>
    </div>

    <script src="js/admin-login.js"></script>
</body>
</html>
